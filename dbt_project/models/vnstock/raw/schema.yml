version: 2

models:
  - name: raw_vnstock_stock_price
    description: "Daily stock OHLCV price data loaded from MinIO (partitioned by ticker and interval)"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - time
            - interval
    columns:
      - name: ticker
        description: "Ticker symbol of the listed company"
        data_tests:
          - not_null
      - name: time
        description: "Trading date"
        data_tests:
          - not_null

  - name: raw_vnstock_gold_price
    description: "Gold price data from SJC/BTMC loaded from MinIO"
    columns:
      - name: name
        description: "Type of gold product (e.g. Vàng SJC 1L, Vàng nữ trang)"
        data_tests:
          - not_null
      - name: branch
        description: "Regional branch"
        data_tests:
          - not_null

  - name: raw_vnstock_exchange_rate
    description: "Vietcombank exchange rate data loaded from MinIO"
    columns:
      - name: currency_code
        description: "ISO currency code (e.g. USD, EUR, JPY)"
        data_tests:
          - not_null

  - name: raw_vnstock_ticker_symbols
    description: "Reference data for all listed ticker symbols on Vietnamese exchanges (HOSE, HNX, UPCOM)"
    columns:
      - name: ticker
        description: "Ticker symbol"
        data_tests:
          - not_null
          - unique
      - name: exchange
        description: "Stock exchange (HOSE, HNX, UPCOM)"
        data_tests:
          - not_null

  - name: raw_vnstock_market_index
    description: "Market index OHLCV data (VNINDEX, VN30, HNXINDEX) loaded from MinIO"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - index_symbol
            - time
    columns:
      - name: index_symbol
        description: "Market index symbol (e.g. VNINDEX, VN30)"
        data_tests:
          - not_null
      - name: time
        description: "Trading date"
        data_tests:
          - not_null

  - name: raw_vnstock_income_statement
    description: "Quarterly/yearly income statement data for listed companies"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - year
            - quarter
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null

  - name: raw_vnstock_balance_sheet
    description: "Quarterly/yearly balance sheet data for listed companies"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - year
            - quarter
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null

  - name: raw_vnstock_cash_flow
    description: "Quarterly/yearly cash flow statement data for listed companies"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ticker
            - year
            - quarter
    columns:
      - name: ticker
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null